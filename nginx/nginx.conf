# ─────────────────────────────────────────────────────────────────────────────
# NutriVision — Nginx Production Config
# ─────────────────────────────────────────────────────────────────────────────
# Replace "api.nutrivision.app" with your actual domain everywhere below.
# SSL certs are expected at /etc/nginx/certs/fullchain.pem + privkey.pem
# (generated by certbot or similar).

worker_processes      auto;
worker_rlimit_nofile  65535;
error_log             /var/log/nginx/error.log warn;
pid                   /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;    # Hide nginx version

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   1000;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml
        text/javascript
        image/svg+xml;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Analysis: expensive ML endpoint — 20 req/min per IP
    limit_req_zone $binary_remote_addr zone=analysis:10m  rate=20r/m;
    # Auth: prevent brute-force — 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth:10m      rate=5r/m;
    # General API: 120 req/min per IP
    limit_req_zone $binary_remote_addr zone=api:10m       rate=120r/m;

    limit_req_status  429;
    limit_conn_zone   $binary_remote_addr zone=conn_limit:10m;
    limit_conn        conn_limit 20;

    # ── Upstream (FastAPI) ─────────────────────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # Let's Encrypt / ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS API server ───────────────────────────────────────────────────────
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name api.nutrivision.app;   # ← replace with your domain

        # ── SSL ───────────────────────────────────────────────────────────────
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'"  always;

        # ── Upload size ───────────────────────────────────────────────────────
        client_max_body_size    20M;
        client_body_buffer_size 128k;

        # ── Proxy defaults ────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;

        # ── Health check (no auth, no rate limit) ─────────────────────────────
        location = /health {
            proxy_pass         http://api_backend/health;
            proxy_read_timeout 5s;
            access_log         off;
        }

        # ── Auth endpoints (strict rate limit) ───────────────────────────────
        location ~ ^/api/v1/auth/ {
            limit_req  zone=auth burst=3 nodelay;
            proxy_pass http://api_backend;
            proxy_read_timeout 15s;
        }

        # ── Analysis endpoint (expensive, rate limited) ───────────────────────
        location ~ ^/api/v1/analysis {
            limit_req  zone=analysis burst=5 nodelay;
            proxy_pass         http://api_backend;
            proxy_read_timeout 180s;   # ML pipeline can take up to ~2 min
            proxy_send_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # ── Flower dashboard (served under /flower/) ──────────────────────────
        location /flower/ {
            proxy_pass         http://flower:5555/flower/;
            proxy_set_header   Host $host;
            proxy_read_timeout 30s;
            # Already protected by Flower's --basic-auth
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req  zone=api burst=30 nodelay;
            proxy_pass         http://api_backend;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # ── OpenAPI docs (disable in prod if desired) ─────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            # Uncomment the next line to disable interactive docs in production:
            # return 403;
            proxy_pass http://api_backend;
        }

        # ── Block everything else ─────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
