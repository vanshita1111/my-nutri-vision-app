# ─────────────────────────────────────────────────────────────────────────────
# EfficientNet-B3 Secondary Classifier — Training Config
# ─────────────────────────────────────────────────────────────────────────────
#
# This model is used when YOLO detection confidence < 0.6.
# It classifies cropped food regions for a second opinion.
#
# Training command (see training/scripts/train_classifier.py):
#   python training/scripts/train_classifier.py \
#     --config models/configs/efficientnet_training.yaml \
#     --output models/efficientnet_food_classifier.onnx

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture:   efficientnet_b3       # torchvision pretrained on ImageNet
  pretrained:     true                  # Fine-tune from ImageNet weights
  num_classes:    101                   # Match dataset nc below
  input_size:     300                   # EfficientNet-B3 native resolution
  dropout:        0.3

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  # Use indian_food_dataset.yaml classes for production; food101 for baseline
  source:         food101               # food101 | indian_food | combined
  train_dir:      training/data/food101/images/train
  val_dir:        training/data/food101/images/val
  num_classes:    101
  # Overrides when using indian_food source:
  indian_train_dir: training/data/indian_food/images/train
  indian_val_dir:   training/data/indian_food/images/val
  indian_classes:   50

# ── Training hyperparameters ──────────────────────────────────────────────────
training:
  epochs:           60
  batch_size:       32
  num_workers:      4
  pin_memory:       true

  optimizer:        adamw
  learning_rate:    0.001
  weight_decay:     0.01
  momentum:         0.9          # Used if optimizer = sgd

  # LR schedule: cosine annealing with warm restart
  scheduler:        cosine
  warmup_epochs:    3
  min_lr:           1.0e-6

  # Mixed precision (speeds up training on GPU/MPS significantly)
  amp:              true

  # Early stopping: stop if val_acc doesn't improve for N epochs
  early_stopping_patience: 10

# ── Augmentation ─────────────────────────────────────────────────────────────
augmentation:
  # Training
  random_resized_crop:  300
  random_horizontal_flip: 0.5
  color_jitter:
    brightness: 0.3
    contrast:   0.3
    saturation: 0.3
    hue:        0.05
  random_rotation:  15
  random_erasing:   0.1         # Randomly erase patches (simulates occlusion)

  # Normalization — ImageNet stats (same as EfficientNet pretraining)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]

  # Validation (no augmentation, just resize + centre crop)
  val_resize:       320
  val_centre_crop:  300

# ── Export ────────────────────────────────────────────────────────────────────
export:
  format:           onnx
  opset:            17
  output_path:      models/efficientnet_food_classifier.onnx
  # Quantize to INT8 for faster inference on CPU (slight accuracy trade-off)
  quantize:         false
  dynamic_axes:     true         # Allow variable batch size in ONNX

# ── Evaluation thresholds ─────────────────────────────────────────────────────
evaluation:
  # Only use classifier prediction if its confidence exceeds this threshold
  min_confidence:   0.55
  # YOLO detections below this confidence are sent to the classifier
  yolo_fallback_threshold: 0.60

